buildscript {
	dependencies {
		constraints {
			classpath 'com.fasterxml.jackson.core:jackson-core:2.21.7'
			classpath 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
			classpath 'org.apache.commons:commons-lang3:3.18.0'
			classpath 'org.apache.httpcomponents.client5:httpclient5:5.6.5'
			classpath 'org.apache.httpcomponents.core5:httpcore5:5.4.4'
			classpath 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.4'
		}
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id 'jacoco'
}

group = 'kwh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('springModulithVersion', '1.4.14')
	set('tomcat.version', '10.1.61')
	set('netty.version', '4.1.137.Final')
	set('jackson-bom.version', '2.21.7')
	set('rabbit-amqp-client.version', '5.37.0')
	set('commons-lang3.version', '3.18.0')
	set('log4j2.version', '2.25.5')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-amqp'
		compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:rabbitmq'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.apache.commons:commons-compress:1.27.1'

	//H2
	runtimeOnly 'com.h2database:h2'

	// Lombok Test
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

	//JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	//Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.redisson:redisson-spring-boot-starter:3.52.0'
	implementation('software.amazon.awssdk:s3:2.57.8') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
		exclude group: 'software.amazon.awssdk', module: 'apache5-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client:2.57.8'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	//MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// Spring Modulith
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

}

jar {
	enabled = false
}


allprojects {
	repositories {
		mavenCentral()
		maven { url 'https://jitpack.io' }
	}
}


tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// DTO, 생성 코드, 설정은 커버리지 측정에서 제외
def jacocoExcludes = [
		'**/dto/**',
		'**/Q*.class',
		'**/*MapperImpl*',
		'**/config/**',
		'**/CofshopApplication*'
]

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	})
}

// 현재 수준을 하한으로 고정해 후퇴를 막음. 목표치는 docs/TESTING.md 참고
tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'test'
	classDirectories.setFrom(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	})
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.85
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.65
			}
		}
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
