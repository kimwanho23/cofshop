route:
  receiver: discord
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: discord
      repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      # 웹훅 URL은 비밀값이므로 컨테이너 시작 시 환경 변수로 만든 파일에서 읽음
      - webhook_url_file: /tmp/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[{{ .CommonLabels.severity }}] 발생{{ else }}해결{{ end }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ "\n" }}{{ end }}'
